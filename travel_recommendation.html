<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover beaches, temples, and countries for your next journey.">
  <title>Wanderly | Travel Recommendations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<body class="home-page">
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" href="./travel_recommendation.html" aria-label="Wanderly home">
      <span class="brand-mark">W</span>
      <span>Wanderly</span>
    </a>

    <ul class="nav-links">
      <li><a class="active" href="./travel_recommendation.html" id="home">Home</a></li>
      <li><a href="./travel_about.html" id="about">About Us</a></li>
      <li><a href="./travel_contact.html" id="contact">Contact Us</a></li>
    </ul>

    <div class="search-bar" role="search">
